server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # I documenti restano nel browser: il server non riceve nulla e non registra nulla.
    access_log off;
    server_tokens off;
    client_max_body_size 1k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
